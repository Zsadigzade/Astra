    <title>Astra - The Haggle</title>
    <script>
      // Apply the saved (or system) theme before first paint so there is no flash.
      // Same rule as src/lib/theme.js resolveTheme; keep the two in sync.
      (function () {
        var t = null;
        try { t = localStorage.getItem("haggle-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
